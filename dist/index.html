<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f6"><title>MYO Quest · Explorer et comprendre le corps</title><meta name="description" content="Atlas musculaire 3D interactif et défis d’anatomie."><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body>
<header><a class="brand" href="./"><span class="brand-mark">m</span>myo<span>quest</span></a><nav aria-label="Navigation"><button data-mode="explore" class="active">Explorer</button><button data-mode="quiz">Défis</button></nav><button id="progress-open" class="progress-link" aria-label="Voir ma progression"><span id="level-label">Niveau 1</span><span id="header-xp">0 XP</span></button></header>
<main id="workspace"><section class="anatomy" aria-label="Atlas anatomique"><div class="atlas-toolbar"><div class="search-wrap"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input type="search" id="search" autocomplete="off" placeholder="Trouver un muscle ou un os" aria-label="Trouver un muscle ou un os"></label><div id="search-results" class="search-results" hidden></div></div><label class="select-wrap"><span class="sr-only">Région à cadrer</span><select id="region"><option value="all">Corps entier</option><option value="head">Tête et cou</option><option value="trunk">Tronc</option><option value="upper">Bras</option><option value="hands">Mains</option><option value="lower">Jambes</option><option value="feet">Pieds</option></select></label><label class="select-wrap"><span class="sr-only">Couches anatomiques</span><select id="layers"><option value="all">Muscles et os</option><option value="deep">Muscles profonds</option><option value="bones">Squelette</option></select></label></div>
<div id="viewer" tabindex="0" aria-label="Corps humain 3D. Rotation : glisser. Déplacement : choisir Déplacer ou Maj et glisser. Zoom : molette. Les flèches déplacent la vue, plus et moins zooment."></div>
<div id="loading" class="loading"><span class="loading-emblem">m</span><h2>Préparation de l’atlas</h2><p id="load-message">Chargement de l’anatomie détaillée…</p><progress id="load-progress" value="0" max="100"></progress></div>
<div id="hover-label" class="hover-label" hidden></div><div class="view-label" id="view-label">Vue antérieure</div><button id="restore" class="restore" hidden>Rétablir les structures</button>
<div class="viewport-actions"><button id="zoom-in" aria-label="Zoom avant" title="Zoom avant">+</button><button id="zoom-out" aria-label="Zoom arrière" title="Zoom arrière">−</button><button id="reset-view" aria-label="Recentrer le corps" title="Recentrer le corps">⌖</button></div>
<div class="navigation-bar"><div class="movement" aria-label="Mode de navigation"><button id="rotate-mode" class="active" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2 6M20 5v6h-6"/></svg>Tourner</button><button id="pan-mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg>Déplacer</button></div><label><span class="sr-only">Orientation du corps</span><select id="orientation"><option value="custom" hidden>Vue ciblée</option><option value="front">Face</option><option value="back">Dos</option><option value="left">Côté gauche</option><option value="right">Côté droit</option><option value="bottom">Plante des pieds</option></select></label></div>
<p class="navigation-hint" id="navigation-hint">Glisser pour tourner · Molette pour zoomer · Double-clic pour cibler</p></section>
<aside id="detail" class="detail" aria-label="Fiche anatomique"></aside></main>
<section id="progress-page" class="progress-page" hidden></section>
<footer><span id="atlas-summary">Atlas anatomique</span><button id="sources-open">Sources et précision du modèle ↗</button></footer>
<dialog id="sources-dialog"><div class="dialog-heading"><h2>Sources et précision</h2><button id="sources-close" aria-label="Fermer">✕</button></div><div id="source-content"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div><script type="module" src="app.js"></script></body></html>
